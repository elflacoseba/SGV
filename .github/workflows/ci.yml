name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: sgv_test_pwd
          MYSQL_DATABASE: sgv_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        working-directory: src/SGV.Web
        run: bun ci

      - name: Audit frontend dependencies
        working-directory: src/SGV.Web
        run: bun audit --audit-level=high

      - name: Build frontend assets
        working-directory: src/SGV.Web
        run: bun run build

      - name: Verify generated frontend assets are current
        working-directory: src/SGV.Web
        run: git diff --exit-code -- bun.lock wwwroot

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests (with MySQL)
        env:
          ConnectionStrings__SgvDatabase: Server=127.0.0.1;Port=3306;Database=sgv_test;User=root;Password=sgv_test_pwd;Allow User Variables=True;Default Command Timeout=60
          Jwt__SigningKey: ${{ secrets.JWT_SIGNING_KEY }}
        run: dotnet test --no-build --configuration Release --verbosity normal
